<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUFAIKA by THE LIGHT OF HOPE | Partnerships for Impact</title>
<meta name="description" content="Join NUFAIKA by THE LIGHT OF HOPE in expanding access to knowledge, learning, digital entrepreneurship and opportunity.">
<style>
:root{--navy:#10253f;--gold:#e9b949;--cream:#fffaf0;--ink:#182435;--muted:#5d6b7b;--green:#176b57}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);line-height:1.65;background:#fff}
header{background:linear-gradient(135deg,#10253f,#174b5d);color:white;padding:22px 7%;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.04em}.brand span{color:var(--gold)}nav a{color:white;text-decoration:none;margin:0 10px;font-size:.95rem}
.hero{padding:85px 7%;background:linear-gradient(135deg,#10253f,#174b5d);color:white}.hero h1{font-size:clamp(2.2rem,5vw,4.2rem);line-height:1.12;max-width:900px;margin:0 0 20px}.hero p{max-width:760px;font-size:1.15rem;color:#e5edf5}
.btn{display:inline-block;background:var(--gold);color:#132238;padding:13px 22px;border-radius:9px;text-decoration:none;font-weight:800;margin:10px 10px 0 0}.btn.secondary{background:transparent;color:white;border:1px solid #fff}
section{padding:58px 7%}.cream{background:var(--cream)}h2{font-size:2rem;color:var(--navy);margin:0 0 18px}h3{color:var(--navy)}.intro{max-width:850px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{border:1px solid #e3e8ee;border-radius:16px;padding:23px;background:white;box-shadow:0 8px 22px #10253f0c}.card h3{margin-top:0}.number{font-size:1.5rem;color:var(--green);font-weight:900}
ul{padding-left:22px}.pill{display:inline-block;padding:5px 12px;background:#e7f2ee;border-radius:99px;color:var(--green);font-weight:700;font-size:.85rem}
form{display:grid;gap:14px;max-width:780px}label{font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5df;border-radius:8px;font:inherit}textarea{min-height:130px}button{border:0;cursor:pointer;font:inherit}
footer{background:#0c1b2e;color:#dce5ef;padding:30px 7%}footer a{color:var(--gold)}.note{font-size:.9rem;color:var(--muted)}
</style></head>
<body>
<header><div class="brand">NUFAIKA <span>by THE LIGHT OF HOPE</span></div><nav><a href="#vision">Our Vision</a><a href="#impact">Our Impact</a><a href="#growth">Our Growth</a><a href="#partner">Partner With Us</a></nav></header>
<main>
<div class="hero"><span class="pill">INNOVATION • KNOWLEDGE • OPPORTUNITY</span><h1>Opening doors to knowledge, growth and opportunity.</h1>
<p>NUFAIKA by THE LIGHT OF HOPE is an emerging digital platform with a vision to connect people to knowledge, books, practical guidance, entrepreneurial resources and new opportunities for growth.</p>
<a class="btn" href="#partner">Partner With NUFAIKA</a><a class="btn secondary" href="#vision">Discover Our Vision</a></div>
<section id="vision"><h2>Our Vision</h2><p class="intro">We envision a digital space where knowledge becomes practical, ideas inspire action, and people can discover resources that support personal development, entrepreneurship and economic opportunity. NUFAIKA brings together useful information, books, promotion and digital services within one growing platform.</p>
<div class="grid"><article class="card"><h3>Knowledge & Guidance</h3><p>Share practical insights, helpful guides and ideas that encourage learning, problem-solving and personal development.</p></article><article class="card"><h3>Books & Learning</h3><p>Help readers discover books, educational materials and resources that inspire growth and broaden opportunity.</p></article><article class="card"><h3>Business & Marketplace</h3><p>Encourage business visibility, entrepreneurship, promotion and connections through digital tools.</p></article><article class="card"><h3>Discover Opportunities</h3><p>Connect users with resources, networks and opportunities that can help them move forward.</p></article></div></section>
<section id="impact" class="cream"><h2>The difference we aim to make</h2><p class="intro">Our mission is to make valuable knowledge and practical digital opportunities more accessible, inspire initiative and support people in pursuing meaningful personal and economic progress.</p><div class="grid"><div class="card"><div class="number">Access</div><p>Expand access to useful knowledge and digital resources.</p></div><div class="card"><div class="number">Empowerment</div><p>Encourage skills, confidence, informed decisions and self-development.</p></div><div class="card"><div class="number">Enterprise</div><p>Promote entrepreneurship, creators, books and small-business visibility.</p></div><div class="card"><div class="number">Opportunity</div><p>Build pathways for collaboration, participation and sustainable growth.</p></div></div></section>
<section id="growth"><h2>Building the next chapter of NUFAIKA</h2><p class="intro">We are seeking visionary partners who believe in the power of knowledge, technology and entrepreneurship to create meaningful opportunities. Strategic support will help us strengthen the platform, expand our resources, reach more people and grow our services.</p><div class="grid"><article class="card"><h3>Platform Development</h3><p>Enhance the user experience and digital services so the platform can serve its community effectively.</p></article><article class="card"><h3>Content & Resources</h3><p>Expand practical guides, educational content, books and helpful digital resources.</p></article><article class="card"><h3>Community Reach</h3><p>Introduce NUFAIKA to new communities, users, creators and entrepreneurial networks.</p></article><article class="card"><h3>Long-term Sustainability</h3><p>Strengthen partnerships, services and sustainable models that support continued growth.</p></article></div></section>
<section class="cream"><h2>Join us in creating opportunity</h2><p class="intro">We welcome organisations and individuals who share our vision and would like to contribute through funding partnerships, mentorship, collaboration, innovation support or strategic connections.</p><ul><li>Funding and grant partnerships</li><li>Corporate and community sponsorship</li><li>Mentorship and innovation programmes</li><li>Technology and knowledge partnerships</li><li>Publishing, content and entrepreneurship networks</li></ul><p><strong>Every meaningful partnership can help us take the next step toward expanding knowledge and opportunity.</strong></p></section>
<section id="partner"><h2>Let's build something meaningful together</h2><p class="intro">We would be delighted to connect with organisations, foundations, investors, mentors and partners interested in the NUFAIKA vision.</p>
<form id="contactForm"><label>Your name<input id="name" required placeholder="Your name"></label><label>Organisation<input id="org" placeholder="Organisation (optional)"></label><label>Email<input id="email" type="email" required placeholder="Your email address"></label><label>How would you like to connect?<select id="interest"><option>Funding or grant partnership</option><option>Investment discussion</option><option>Strategic partnership</option><option>Mentorship or accelerator</option><option>Technology or innovation support</option><option>Content or publishing collaboration</option><option>Other</option></select></label><label>Your message<textarea id="message" required placeholder="Share a little about your interest in connecting with NUFAIKA."></textarea></label><button class="btn" type="submit">Send Partnership Enquiry</button></form>
<p class="note">Contact: <a href="mailto:romanusnillongo21@gmail.com">romanusnillongo21@gmail.com</a></p></section>
</main><footer><strong>NUFAIKA by THE LIGHT OF HOPE</strong><p>Knowledge • Growth • Opportunity</p><p>Contact: <a href="mailto:romanusnillongo21@gmail.com">romanusnillongo21@gmail.com</a></p></footer>
<script>
document.getElementById('contactForm').addEventListener('submit',function(e){e.preventDefault();const name=document.getElementById('name').value,org=document.getElementById('org').value,email=document.getElementById('email').value,interest=document.getElementById('interest').value,message=document.getElementById('message').value;const subject=encodeURIComponent('Partnership enquiry | NUFAIKA by THE LIGHT OF HOPE');const body=encodeURIComponent('Name: '+name+'\\nOrganisation: '+org+'\\nEmail: '+email+'\\nInterest: '+interest+'\\n\\nMessage:\\n'+message);window.location.href='mailto:romanusnillongo21@gmail.com?subject='+subject+'&body='+body;});
</script></body></html>
